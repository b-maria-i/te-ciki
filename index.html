<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJP C1 · платформа школы</title>
<style>
  :root{
    --paper:#f6f3ec; --paper-line:#dcd5c4; --ink:#1f2420; --ink-soft:#5b5a52;
    --crimson:#a3273c; --crimson-deep:#7c1c2c; --gold:#b3893a;
    --ok:#2f6b4f; --bad:#a3273c;
    --mono:'Courier New',ui-monospace,SFMono-Regular,Menlo,monospace;
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); padding-bottom:60px;}

  header{padding:14px 18px; border-bottom:1px solid var(--paper-line); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  header h1{font-size:15px; font-weight:400; margin:0;}
  .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--crimson-deep);}
  .controls{display:flex; gap:7px; flex-wrap:wrap; align-items:center;}
  .btn{font-family:var(--mono); font-size:10.5px; border:1px solid var(--ink); background:transparent; color:var(--ink); padding:7px 10px; cursor:pointer; text-decoration:none; display:inline-block;}
  .btn.on{background:var(--ink); color:var(--paper);}
  .btn.crimson{border-color:var(--crimson); color:var(--crimson);}
  .btn.crimson:hover{background:var(--crimson); color:#fff;}
  .btn[disabled]{opacity:.4; cursor:default;}

  nav.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--paper-line); border-bottom:1px solid var(--paper-line);}
  .tab{background:var(--paper); padding:10px 6px; text-align:center; cursor:pointer; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
  .tab .n{display:block; font-family:var(--serif); font-size:16px; color:var(--ink);}
  .tab.active{background:var(--ink); color:var(--paper);}
  .tab.active .n{color:var(--paper);}
  .tab .clock{display:block; font-size:10px; color:var(--gold); margin-top:2px;}
  .tab.active .clock{color:#e8c988;}

  main, .page{max-width:820px; margin:0 auto; padding:22px;}
  .section-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:16px; flex-wrap:wrap; gap:8px;}
  .section-head h2{font-size:19px; font-weight:400; margin:0;}
  .section-meta{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
  .timer-controls{display:flex; gap:8px; align-items:center;}
  .timerbox{font-family:var(--mono); font-size:22px; border:1px solid var(--ink); padding:4px 12px; min-width:92px; text-align:center;}
  .timerbox.low{color:var(--bad); border-color:var(--bad);}

  .task{margin-bottom:22px; border:1px solid var(--paper-line); background:#fffef9;}
  .task-title{font-family:var(--mono); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--crimson-deep); padding:10px 14px; border-bottom:1px solid var(--paper-line); background:#f4f0e4; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .task-title .tscore{color:var(--ink-soft); font-size:11px; white-space:nowrap;}
  .task-note{font-size:12.5px; color:var(--ink-soft); padding:8px 14px 0; line-height:1.5;}
  .items{padding:6px 14px 14px;}
  .item{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid #ece6d6; flex-wrap:wrap;}
  .item:last-child{border-bottom:none;}
  .item .qn{font-family:var(--mono); width:22px; flex-shrink:0; color:var(--ink-soft); font-size:12px;}
  .choices{display:flex; gap:5px;}
  .choice{font-family:var(--mono); font-size:12px; border:1px solid var(--ink-soft); min-width:28px; height:28px; padding:0 6px; cursor:pointer; background:transparent; color:var(--ink);}
  .choice.picked{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .choice[disabled]{cursor:default; opacity:.85;}
  .ro-answer{font-family:var(--mono); font-size:12.5px; padding:5px 10px; background:#f4f0e4; min-width:50px; text-align:center; border:1px solid var(--paper-line);}
  .ro-answer.ok{border-color:var(--ok); color:var(--ok);}
  .ro-answer.bad{border-color:var(--bad); color:var(--bad); text-decoration:line-through;}
  .ro-mark{font-family:var(--mono); font-size:14px; width:22px; text-align:center;}
  .ro-mark.ok{color:var(--ok);}
  .ro-mark.bad{color:var(--bad);}
  .txtin{font-family:var(--mono); font-size:12.5px; border:none; border-bottom:1px solid var(--ink-soft); background:transparent; padding:5px 2px; flex:1; min-width:100px; color:var(--ink);}
  select.matchsel{font-family:var(--mono); font-size:12px; padding:4px; border:1px solid var(--ink-soft); background:var(--paper);}
  .manual-note{font-family:var(--mono); font-size:11px; color:var(--ink-soft); padding:8px 14px 12px;}
  .section-score{font-family:var(--mono); font-size:12px; background:#fffef9; border:1px solid var(--paper-line); padding:7px 11px; margin-bottom:14px; display:flex; justify-content:space-between;}
  .section-score b{color:var(--crimson-deep);}

  audio{width:100%; margin-top:8px;}
  .audiobox{border:1px solid var(--paper-line); background:#fffef9; padding:10px 14px; margin-bottom:16px;}
  .audiobox label{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}

  .banner{display:none; background:var(--ink); color:var(--paper); padding:12px 18px; font-family:var(--mono); font-size:12.5px;}

  .authbox{max-width:360px; margin:60px auto; padding:28px; border:1px solid var(--paper-line); background:#fffef9;}
  .authbox h2{font-weight:400; margin-top:0;}
  .authbox input, .authbox select{width:100%; padding:9px; margin-bottom:10px; font-family:var(--mono); font-size:13px; border:1px solid var(--paper-line); background:var(--paper);}
  .authbox .btn{width:100%; text-align:center; padding:10px;}
  .authswitch{text-align:center; margin-top:14px; font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
  .authswitch a{color:var(--crimson-deep); cursor:pointer; text-decoration:underline;}
  .err{color:var(--bad); font-family:var(--mono); font-size:11.5px; margin-bottom:10px;}

  .student-card{border:1px solid var(--paper-line); background:#fffef9; padding:14px 16px; margin-bottom:12px;}
  .student-card .top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .student-card b{font-size:15px;}
  .student-card .meta{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
  .assign-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center;}
  .assign-row select{font-family:var(--mono); font-size:11px; padding:6px; border:1px solid var(--paper-line); background:var(--paper);}
  .attempt-chip{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; border:1px solid var(--paper-line); padding:5px 9px; margin:4px 6px 0 0; cursor:pointer;}
  .attempt-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-soft);}
  .attempt-chip.assigned .dot{background:var(--gold);}
  .attempt-chip.in_progress .dot{background:#3a7ca5;}
  .attempt-chip.awaiting .dot{background:var(--crimson);}
  .attempt-chip.reviewed .dot{background:var(--ok);}

  .mark-row{display:flex; gap:4px;}
  .mark-btn{font-family:var(--mono); font-size:11px; border:1px solid var(--ink-soft); width:26px; height:26px; cursor:pointer; background:transparent;}
  .mark-btn.ok{border-color:var(--ok); color:var(--ok);}
  .mark-btn.ok.on{background:var(--ok); color:#fff;}
  .mark-btn.bad{border-color:var(--bad); color:var(--bad);}
  .mark-btn.bad.on{background:var(--bad); color:#fff;}
  .student-answer{font-family:var(--mono); font-size:12.5px; padding:6px 10px; background:#f4f0e4; min-width:60px; text-align:center;}
  .tutor-score{font-family:var(--mono); font-size:13px; background:#fffef9; border:1px solid var(--paper-line); padding:8px 12px; margin-bottom:16px; display:flex; justify-content:space-between;}
  .tutor-score b{color:var(--crimson-deep);}
  .klucz-pin{position:sticky; top:0; z-index:5; background:var(--paper); padding:10px 0; border-bottom:1px solid var(--paper-line); margin-bottom:16px;}
  .comment-box{border:1px solid var(--paper-line); background:#fffef9; padding:12px 14px; margin:16px 0;}
  .comment-box textarea{width:100%; min-height:70px; font-family:var(--serif); font-size:13.5px; border:1px solid var(--paper-line); padding:8px; margin-top:6px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

/* ---- tutor-side (real Supabase Auth session, RLS-protected) ---- */
async function sbTutorSignUp(name, login, password){
  const { data, error } = await sb.auth.signUp({
    email: syntheticEmail(login), password, options:{ data:{ name } }
  });
  return { data, error };
}
async function sbTutorSignIn(login, password){
  const { data, error } = await sb.auth.signInWithPassword({ email: syntheticEmail(login), password });
  return { data, error };
}
async function sbTutorSignOut(){ await sb.auth.signOut(); }
async function sbCurrentTutor(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return null;
  const { data, error } = await sb.from('tutors').select('id,name').eq('id', user.id).single();
  if(error || !data) return null;
  return data;
}
async function sbListStudents(){
  const { data, error } = await sb.from('students').select('*').order('created_at', {ascending:true});
  if(error){ console.error(error); return []; }
  return data || [];
}
async function sbAddStudent(name, nickname, password, level, tutorId){
  const { error } = await sb.from('students').insert({ tutor_id: tutorId, name, nickname, password, level });
  return error;
}
async function sbListAttempts(){
  const { data, error } = await sb.from('attempts').select('*');
  if(error){ console.error(error); return []; }
  return (data||[]).map(mapAttempt);
}
async function sbAssignTest(studentId, examId){
  const { error } = await sb.from('attempts').insert({ student_id: studentId, exam_id: examId });
  return error;
}
async function sbUpdateMarks(attemptId, marks){
  const { error } = await sb.from('attempts').update({ marks }).eq('id', attemptId);
  return error;
}
async function sbReleaseAttempt(attemptId, comment){
  const { error } = await sb.from('attempts').update({ comment, released:true, released_at:new Date().toISOString() }).eq('id', attemptId);
  return error;
}

function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function esc(s){ return (s||'').toString().replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

async function boot(){
  const tutor = await sbCurrentTutor();
  if(tutor){ cache.tutor = tutor; state.screen='tutorDash'; render(); return; }
  const savedStudent = localStorage.getItem('pjp_student');
  if(savedStudent){ cache.student = JSON.parse(savedStudent); state.screen='studentDash'; render(); return; }
  state.screen='auth'; render();
}

function renderAuth(){
  headerControlsEl.innerHTML='';
  document.getElementById('pageTitle').textContent='PJP C1 — вход';
  const mode = state.authMode;
  let html = `<div class="authbox">
    <div style="display:flex; gap:6px; margin-bottom:16px;">
      <button class="btn ${mode==='tutor'?'on':''}" id="modeTutor" style="flex:1;">Репетитор</button>
      <button class="btn ${mode==='student'?'on':''}" id="modeStudent" style="flex:1;">Ученик</button>
    </div>`;
  if(state.authError) html += `<div class="err">${esc(state.authError)}</div>`;
  if(mode==='tutor'){
    html += `<h2>Вход репетитора</h2>
      <input id="loginInput" placeholder="логин">
      <input id="passInput" type="password" placeholder="пароль">
      <button class="btn crimson" id="loginBtn">Войти</button>
      <div class="authswitch">Нет аккаунта? <a id="toRegister">Зарегистрироваться</a></div>`;
  } else {
    html += `<h2>Вход ученика</h2>
      <input id="loginInput" placeholder="ник">
      <input id="passInput" type="password" placeholder="пароль">
      <button class="btn crimson" id="loginBtn">Войти</button>
      <div class="authswitch">Ник и пароль выдаёт ваш репетитор.</div>`;
  }
  html += `</div>`;
  appEl.innerHTML = html;

  document.getElementById('modeTutor').onclick=()=>{ state.authMode='tutor'; state.authError=''; render(); };
  document.getElementById('modeStudent').onclick=()=>{ state.authMode='student'; state.authError=''; render(); };

  document.getElementById('loginBtn').onclick=async ()=>{
    const login = document.getElementById('loginInput').value.trim();
    const pass = document.getElementById('passInput').value;
    if(!login || !pass){ state.authError='Заполните оба поля.'; render(); return; }
    if(mode==='tutor'){
      const { error } = await sbTutorSignIn(login, pass);
      if(error){ state.authError='Неверный логин или пароль.'; render(); return; }
      const tutor = await sbCurrentTutor();
      cache.tutor = tutor;
      state.screen='tutorDash'; state.authError=''; render();
    } else {
      const s = await sbStudentLogin(login, pass);
      if(!s){ state.authError='Неверный ник или пароль.'; render(); return; }
      cache.student = s;
      localStorage.setItem('pjp_student', JSON.stringify(s));
      state.screen='studentDash'; state.authError=''; render();
    }
  };
  if(mode==='tutor'){
    document.getElementById('toRegister').onclick=()=>{ state.screen='tutorRegister'; state.authError=''; render(); };
  }
}

function renderTutorRegister(){
  headerControlsEl.innerHTML='';
  document.getElementById('pageTitle').textContent='PJP C1 — регистрация репетитора';
  let html = `<div class="authbox"><h2>Регистрация репетитора</h2>`;
  if(state.authError) html += `<div class="err">${esc(state.authError)}</div>`;
  html += `
    <input id="nameInput" placeholder="имя">
    <input id="loginInput" placeholder="логин">
    <input id="passInput" type="password" placeholder="пароль (минимум 6 символов)">

    <div class="authswitch"><a id="toLogin">← назад ко входу</a></div>
  </div>`;
  appEl.innerHTML = html;
  document.getElementById('toLogin').onclick=()=>{ state.screen='auth'; state.authError=''; render(); };
  document.getElementById('regBtn').onclick=async ()=>{
    const name=document.getElementById('nameInput').value.trim();
    const login=document.getElementById('loginInput').value.trim();
    const pass=document.getElementById('passInput').value;
    if(!name||!login||!pass){ state.authError='Заполните все поля.'; render(); return; }
    if(pass.length<6){ state.authError='Пароль должен быть не короче 6 символов.'; render(); return; }
    const { error } = await sbTutorSignUp(name, login, pass);
    if(error){ state.authError = error.message.includes('already') ? 'Такой логин уже занят.' : error.message; render(); return; }
    const { error: signInErr } = await sbTutorSignIn(login, pass);
    if(signInErr){ state.authError='Аккаунт создан, но не удалось войти автоматически — попробуйте войти вручную.'; state.screen='auth'; render(); return; }
    const tutor = await sbCurrentTutor();
    cache.tutor = tutor;
    state.screen='tutorDash'; state.authError=''; render();
  };
}

function statusOf(att){
  if(att.released) return 'reviewed';
  if(att.finishedAt) return 'awaiting';
  if(att.startedAt) return 'in_progress';
  return 'assigned';
}
const STATUS_LABEL = {assigned:'назначен', in_progress:'проходит', awaiting:'ждёт проверки', reviewed:'проверено'};

const LEVELS = ['A2','B1','B2','C1'];
function examOptionsForLevel(level, studentId){
  const all = Object.keys(EXAM_META).filter(k=>EXAM_META[k].level===level);
  const activeExamIds = new Set(
    cache.attempts.filter(a=>a.studentId===studentId && !a.released).map(a=>a.examId)
  );
  return all.filter(k=>!activeExamIds.has(k));
}

async function refreshTutorCache(){
  cache.students = await sbListStudents();

}

function studentCardHtml(st, attempts, lvl){
  const myAttempts = attempts.filter(a=>a.studentId===st.id).sort((a,b)=>(b.assignedAt||'').localeCompare(a.assignedAt||''));
  const available = examOptionsForLevel(lvl, st.id);
  const pickerHtml = available.length
    ? `<select id="examPick_${st.id}">${available.map(k=>`<option value="${k}">${EXAM_META[k].label}</option>`).join('')}</select>
       <button class="btn" data-assign="${st.id}">Назначить тест</button>`
    : `<span class="manual-note" style="padding:0; white-space:nowrap;">все варианты уровня ${lvl} уже назначены</span>`;
  return `<div class="student-card">
      <div class="top"><div><b>${esc(st.name)}</b> <span class="meta">@${esc(st.nickname)} · ${esc(st.level)}</span></div>
        <div class="assign-row">
          <div style="display:flex; gap:4px;">${LEVELS.map(l=>`<button class="btn ${lvl===l?'on':''}" data-lvlbtn="${st.id}" data-lvl="${l}" style="padding:6px 8px;">${l}</button>`).join('')}</div>
          ${pickerHtml}
          <button class="btn" data-archive="${st.id}">📊 Архив</button>
        </div>
      </div>
      <div style="margin-top:10px;">${myAttempts.length===0 ? '<span class="manual-note" style="padding:0;">Ещё ничего не назначено.</span>' : myAttempts.map(a=>{
        const st5=statusOf(a);
        return `<span class="attempt-chip ${st5}" data-openattempt="${a.id}"><span class="dot"></span>${EXAM_META[a.examId].label} — ${STATUS_LABEL[st5]}</span>`;
      }).join('')}</div>
    </div>`;
}

function taskMarkScore(attempt, task){
  const n = task.n || (task.letters?task.letters.length:0);
  let ok=0;
  for(let i=0;i<n;i++){ if((attempt.marks||{})[task.id+':'+i]==='ok') ok++; }
  return {ok, total:n};
}
function sectionMarkScore(attempt, section){
  let ok=0,total=0;
  section.tasks.forEach(t=>{ const r=taskMarkScore(attempt,t); ok+=r.ok; total+=r.total; });
  return {ok,total};
}

/* ============================================================
   АРХИВ РЕЗУЛЬТАТОВ — история попыток, баллы по разделам, сравнение
   ============================================================ */
function objectiveTotals(attempt){
  const SECTIONS = getSections(attempt.examId).filter(s=>s.id!=='writing');
  const sections = {}; let overall={ok:0,total:0};
  SECTIONS.forEach(s=>{
    const r = sectionMarkScore(attempt, s);
    sections[s.id] = {label:s.label, ok:r.ok, total:r.total};
    overall.ok += r.ok; overall.total += r.total;
  });
  return {sections, overall};
}
function isPass(overall){ return overall.total>0 && (overall.ok/overall.total) >= 0.6; }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'}); }

    };

function drawCompareChart(a1, a2){
  const ot1 = objectiveTotals(a1), ot2 = objectiveTotals(a2);
  const ids = Array.from(new Set([...Object.keys(ot1.sections), ...Object.keys(ot2.sections)]));
  const labels = ids.map(id => (ot1.sections[id]||ot2.sections[id]).label).concat(['Итого']);
  const pct = (s)=> s && s.total>0 ? Math.round(s.ok/s.total*100) : 0;
  const data1 = ids.map(id=>pct(ot1.sections[id])).concat([pct(ot1.overall)]);
  const data2 = ids.map(id=>pct(ot2.sections[id])).concat([pct(ot2.overall)]);

  const label1 = `${EXAM_META[a1.examId].label} · ${fmtDate(a1.releasedAt||a1.finishedAt)}`;
  const label2 = `${EXAM_META[a2.examId].label} · ${fmtDate(a2.releasedAt||a2.finishedAt)}`;

  if(archiveChart) archiveChart.destroy();
  const ctx = document.getElementById('cmpCanvas').getContext('2d');
  archiveChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [
      { label: label1, data: data1, backgroundColor: '#B93A30' },
      { label: label2, data: data2, backgroundColor: '#2F6E5E' }
    ]},
    options: {
      responsive: true,
      scales: { y: { beginAtZero:true, max:100, ticks:{ callback:v=>v+'%' } } },
      plugins: { legend: { position:'bottom' } }
    }
  });
}

    </div></div>`;

  if(s.id==='writing'){
    html += `<div class="task-note" style="margin-bottom:14px;">Темы заданий — в arkusz официального сайта. Прикрепите готовый файл с ответом.</div>
      <div class="task"><div class="task-title">Ваш ответ (файл)</div><div style="padding:14px;">
        <input type="file" id="writingFile" ${testFinishedFlag?'disabled':''}>
        <div class="manual-note" id="writingFileName">${state.writingFileName?'Прикреплено: '+esc(state.writingFileName):'Файл не прикреплён'}</div>
      </div></div></main>`;
    appEl.innerHTML = html;
    renderTabs();
    const fi=document.getElementById('writingFile');
    if(fi) fi.addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; state.writingFileName=f.name; document.getElementById('writingFileName').textContent='Прикреплено: '+esc(f.name); saveProgress(); });
    document.getElementById('timerToggle').onclick=()=>{ withScrollPreserved(()=>{ state.running[s.id]=!state.running[s.id]; renderStudentTest(); }); };
    return;
  }

  if(s.id==='listening'){
    const meta = EXAM_META[testExamId];
    if(meta.audioUrl){
      html += `<div class="audiobox"><a class="btn crimson" href="${meta.audioUrl}" target="_blank" rel="noopener">🔊 Открыть аудиозапись</a></div>`;
    } else {
      html += `<div class="audiobox manual-note" style="padding:10px 14px;">Аудиозапись для этого варианта пока не привязана — уточните у репетитора.</div>`;
    }
  }
  html += `</main>`;
  appEl.innerHTML = html;
  renderTabs();

  const mainEl = document.querySelector('main');
  s.tasks.forEach(task=>{
    const box=document.createElement('div'); box.className='task';
    box.innerHTML = `<div class="task-title">${task.title}</div>` + (task.note?`<div class="task-note">${task.note}</div>`:'');
    const items=document.createElement('div'); items.className='items';
    if(task.type==='mc'){
      const opts = task.opts || ['a','b','c'];
      items.innerHTML = Array.from({length:task.n}).map((_,i)=>{
        const picked=getAns(task.id,i);
        return `<div class="item"><span class="qn">${i+1}.</span><div class="choices">
          ${opts.map(c=>`<button type="button" class="choice ${picked===c?'picked':''}" data-t="${task.id}" data-i="${i}" data-v="${c}" ${testFinishedFlag?'disabled':''}>${c}</button>`).join('')}
        </div></div>`;
      }).join('');
    } else if(task.type==='open'){
      items.innerHTML = Array.from({length:task.n}).map((_,i)=>{
        const val=getAns(task.id,i)||'';
        return `<div class="item"><span class="qn">${i+1}.</span><input class="txtin" data-t="${task.id}" data-i="${i}" value="${esc(val)}" placeholder="ответ" ${testFinishedFlag?'disabled':''}></div>`;
      }).join('');
    } else if(task.type==='match'){
      items.innerHTML = task.letters.map((L,i)=>{
        const val=getAns(task.id,i)||'';
        return `<div class="item"><span class="qn">${L}</span><select class="matchsel" data-t="${task.id}" data-i="${i}" ${testFinishedFlag?'disabled':''}>
          <option value="">—</option>${task.options.map(o=>`<option value="${o}" ${String(val)===String(o)?'selected':''}>${o}</option>`).join('')}
        </select></div>`;
      }).join('');
    }
    box.appendChild(items);
    mainEl.appendChild(box);
  });

  document.getElementById('timerToggle').onclick=()=>{ withScrollPreserved(()=>{ state.running[s.id]=!state.running[s.id]; renderStudentTest(); }); };

  if(!testFinishedFlag){
    mainEl.querySelectorAll('.choice').forEach(b=>{
      b.onclick=()=>{ withScrollPreserved(()=>{ setAns(b.dataset.t,+b.dataset.i,b.dataset.v); saveProgress(); renderStudentTest(); }); };
    });
    mainEl.querySelectorAll('.txtin').forEach(inp=>{ inp.oninput=()=>{ setAns(inp.dataset.t,+inp.dataset.i,inp.value); saveProgress(); }; });
    mainEl.querySelectorAll('.matchsel').forEach(sel=>{
      sel.onchange=()=>{ withScrollPreserved(()=>{ setAns(sel.dataset.t,+sel.dataset.i,sel.value); saveProgress(); renderStudentTest(); }); };
    });
  }
}

let saveProgressTimer = null;
function saveProgress(){
  clearTimeout(saveProgressTimer);
  saveProgressTimer = setTimeout(()=>{
    sbStudentSaveProgress(state.currentAttemptId, cache.student.id, testAnswers, state.writingFileName);
  }, 500);
}

function confirmFinish(){
  const banner=document.getElementById('resultsBanner');
  banner.style.display='block';
  banner.innerHTML=`Завершить тест сейчас? Изменить ответы после этого будет нельзя.
    <button id="confirmYes" class="btn" style="margin-left:10px; border-color:#fff; color:#fff;">Да, завершить</button>
    <button id="confirmNo" class="btn" style="margin-left:6px; border-color:#fff; color:#fff;">Отмена</button>`;
  document.getElementById('confirmYes').onclick=async ()=>{
    await sbStudentFinish(state.currentAttemptId, cache.student.id, testAnswers);
    testFinishedFlag = true;
    renderStudentTest();
  };
  document.getElementById('confirmNo').onclick=()=>{ banner.style.display='none'; };
}

function renderStudentResults(att){
  const SECTIONS = getSections(att.examId);
  document.getElementById('pageTitle').textContent='PJP C1 — результаты';
  headerControlsEl.innerHTML = `<button class="btn" id="backBtn">← к тестам</button>`;
  document.getElementById('backBtn').onclick=()=>{ state.screen='studentDash'; render(); };

  let html = `<div class="page">`;
  if(att.comment) html += `<div class="banner" style="display:block;">Комментарий репетитора: <i>${esc(att.comment)}</i></div>`;

  let totalOk=0, totalAll=0;
  SECTIONS.forEach(s=>{ const r=sectionMarkScore(att,s); totalOk+=r.ok; totalAll+=r.total; });
  html += `<div class="tutor-score" style="margin-top:16px;"><span>Итого баллов</span><b>${totalOk} / ${totalAll}</b></div>`;

  SECTIONS.forEach(s=>{
    if(!s.tasks.length) return;
    const secScore = sectionMarkScore(att, s);
    html += `<h3 style="font-weight:400; border-bottom:1px solid var(--paper-line); padding-bottom:6px; display:flex; justify-content:space-between;"><span>${s.label}</span><span style="font-family:var(--mono); font-size:12px; color:var(--ink-soft);">${secScore.ok} / ${secScore.total}</span></h3>`;
    s.tasks.forEach(task=>{
      const tscore = taskMarkScore(att, task);
      html += `<div class="task"><div class="task-title"><span>${task.title}</span><span class="tscore">${tscore.ok} / ${tscore.total}</span></div><div class="items">`;
      const n = task.n || (task.letters?task.letters.length:0);
      for(let i=0;i<n;i++){
        const val = (att.answers[task.id]||{})[i];
        const mark = (att.marks||{})[task.id+':'+i];
        const label = task.letters ? task.letters[i] : (i+1);
        const cls = mark==='ok' ? 'ok' : (mark==='bad' ? 'bad' : '');
        const markIcon = mark==='ok' ? '✓' : (mark==='bad' ? '✗' : '·');
        html += `<div class="item"><span class="qn">${label}.</span><span class="ro-answer ${cls}">${val!=null && val!=='' ? esc(val) : '—'}</span><span class="ro-mark ${cls}">${markIcon}</span></div>`;
      }
      html += `</div></div>`;
    });
  });
  html += `</div>`;
  appEl.innerHTML = html;
}

function render(){
  if(state.screen==='auth') renderAuth();
  else if(state.screen==='tutorRegister') renderTutorRegister();
  else if(state.screen==='tutorDash') renderTutorDash();
  else if(state.screen==='addStudent') renderAddStudent();
  else if(state.screen==='tutorReview') renderTutorReview();
  else if(state.screen==='studentDash') renderStudentDash();
  else if(state.screen==='archive') renderArchive();
  else if(state.screen==='studentTest'){
    const att = cache.studentAttempts.find(a=>a.id===state.currentAttemptId);
    if(att && att.released){ renderStudentResults(att); }
    else { renderStudentTest(); }
  }
}

boot();
</script>
